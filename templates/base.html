<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ student_id }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><div class="wrap bar">
<strong>Quản lý chi tiêu · {{ student_id }} · {{ student_name }}</strong>
<nav>{% if session.user_id %}
<a href="{{ url_for('index') }}">Danh sách</a>
<a href="{{ url_for('create') }}">Thêm</a>
<span>{{ session.username }}</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Đăng xuất</button></form>
{% else %}<a href="{{ url_for('login') }}">Đăng nhập</a><a href="{{ url_for('register') }}">Đăng ký</a>{% endif %}</nav>
</div></header>
<main class="wrap">
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
